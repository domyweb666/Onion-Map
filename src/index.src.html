<style>
  /* 手寫字型：辰宇落雁體（OFL），fonts/ 裡附授權 */
  @font-face{font-family:'Luoyan';src:url('fonts/ChenYuluoyan.woff2') format('woff2');font-display:swap}
  :root{
    --paper:#F3ECDB; --paper2:#FAF5E8; --ink:#2E2820; --ink2:#6A5F4E; --accent:#9A3B2A;
    --hand:'Luoyan',"PingFang TC","Noto Sans TC",sans-serif;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden}
  #map{position:fixed;inset:0}
  #vignette{position:fixed;inset:0;pointer-events:none;
    box-shadow:inset 0 0 70px 20px rgba(120,95,60,.14)}
  /* 筆記本的咖啡色頁框、鉛筆顆粒、指北針 */
  #frame{position:fixed;left:6px;right:6px;top:calc(var(--safe-t) + 6px);bottom:calc(var(--safe-b) + 6px);border-radius:12px;
    border:3px solid rgba(107,74,43,.7);box-shadow:inset 0 0 0 2px rgba(107,74,43,.16),inset 0 0 26px rgba(107,74,43,.14);pointer-events:none}
  #grain{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.45;background-repeat:repeat}
  #sketch{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply}
  #compass{position:fixed;left:16px;bottom:calc(var(--safe-b) + 152px);width:30px;height:46px;pointer-events:none;opacity:.85}
  /* 比例尺：細墨線、手寫字 */
  .maplibregl-ctrl-bottom-left{bottom:calc(var(--safe-b) + 152px);left:56px}
  .maplibregl-ctrl-scale{font-family:var(--hand);font-size:12px;color:var(--ink);background:transparent!important;
    border:1.5px solid var(--ink)!important;border-top:none!important;padding:0 4px;box-sizing:content-box}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  .card{background:rgba(250,245,232,.94);border:1px solid rgba(46,40,32,.45);
    box-shadow:0 4px 18px rgba(60,40,15,.18);border-radius:14px}
  #top{position:fixed;left:12px;right:12px;top:calc(var(--safe-t) + 10px);
    display:flex;align-items:center;gap:10px;padding:10px 14px}
  .brand{font-family:var(--hand);font-weight:400;font-size:24px;letter-spacing:3px;line-height:1.1}
  .brand .hl{padding:0 4px;background:linear-gradient(transparent 58%,rgba(236,130,160,.45) 58%,rgba(236,130,160,.45) 88%,transparent 88%)}
  .brand small{display:block;font-size:12px;letter-spacing:1px;color:var(--ink2);margin-top:3px}

  #side{position:fixed;right:12px;top:calc(var(--safe-t) + 78px);display:flex;flex-direction:column;gap:8px}
  #side button{width:52px;height:46px;font-size:13px}
  #side button.on{background:var(--ink);color:var(--paper2)}
  #simbar{position:fixed;left:12px;right:76px;top:calc(var(--safe-t) + 78px);padding:10px}
  #simbar .seg{display:flex;gap:6px}
  #simbar .seg button{flex:1;padding:8px 0;border-radius:9px;background:rgba(78,59,38,.08);font-size:14px}
  #simbar .seg button.on{background:var(--ink);color:var(--paper2)}
  #simhint{font-family:var(--hand);font-size:13px;color:var(--ink2);margin-top:7px;line-height:1.4}
  #panel{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 12px);padding:12px 14px}
  #status{font-family:var(--hand);font-size:15px;color:var(--ink2);min-height:18px;margin-bottom:9px}
  #btnRec{width:100%;padding:14px;border-radius:12px;background:var(--ink);color:var(--paper2);
    font-size:17px;font-weight:600;letter-spacing:1px}
  #btnRec.rec{background:var(--accent)}
  #note{font-family:var(--hand);font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.4}
  #btnSettings{width:100%;margin-top:8px;padding:10px;border-radius:10px;background:rgba(78,59,38,.1);font-size:14px}
  .me{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--paper2);
    box-shadow:0 0 0 0 rgba(154,59,42,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(154,59,42,.55)}100%{box-shadow:0 0 0 18px rgba(154,59,42,0)}}
  #modal{position:fixed;inset:0;background:rgba(40,28,12,.45);display:flex;align-items:flex-end;justify-content:center}
  #modal[hidden],#simbar[hidden]{display:none}
  #sheet{width:100%;max-width:520px;margin:12px;margin-bottom:calc(var(--safe-b) + 12px);padding:16px}
  #sheet h3{margin:0 0 6px;font-family:var(--hand);font-size:21px;font-weight:400}
  #sheet p{margin:0 0 12px;font-family:var(--hand);font-size:14px;color:var(--ink2);line-height:1.5}
  #sheet .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  #sheet .row button,#sheet label.btn{flex:1;min-width:46%;padding:12px;border-radius:10px;
    background:rgba(78,59,38,.1);font-size:14px;text-align:center}
  #sheet .danger{color:var(--accent)}
  #toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 170px);transform:translateX(-50%);
    background:var(--ink);color:var(--paper2);padding:9px 14px;border-radius:10px;font-size:13px;
    opacity:0;transition:opacity .25s;pointer-events:none;max-width:86%;text-align:center}
  #toast.show{opacity:.95}
  .maplibregl-ctrl-attrib{background:rgba(250,245,232,.8)!important;font-size:10px}
  /* 圖例 */
  #legend{position:fixed;inset:0;background:rgba(40,28,12,.35);display:flex;align-items:flex-end;justify-content:center}
  #legend[hidden]{display:none}
  #legendSheet{width:100%;max-width:520px;margin:12px;margin-bottom:calc(var(--safe-b) + 12px);padding:16px}
  #legendSheet h3{margin:0 0 10px;font-family:var(--hand);font-size:21px;font-weight:400}
  #legendRows{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;margin-bottom:12px}
  #legendRows div{display:flex;align-items:center;gap:10px;font-family:var(--hand);font-size:15px}
  #legendRows i{display:block;flex:none;width:46px;height:26px;border:1px solid rgba(46,40,32,.5);background-color:var(--paper)}
  #legendRows i.road{background:linear-gradient(var(--paper) 0 30%,var(--ink) 30% 37%,#F2CF5B 37% 63%,var(--ink) 63% 70%,var(--paper) 70%)}
  #legendRows i.hwy{background:linear-gradient(var(--paper) 0 30%,var(--ink) 30% 37%,#CFC9BC 37% 63%,var(--ink) 63% 70%,var(--paper) 70%)}

  #btnLegendClose{width:100%;padding:12px;border-radius:10px;background:rgba(78,59,38,.1);font-size:14px}
  .maplibregl-ctrl-bottom-right{bottom:calc(var(--safe-b) + 150px)}
</style>

<script>
/*ENGINE_START*/
// ===== 探索引擎：純邏輯，不碰地圖與畫面，方便獨立測試 =====
const CFG = {
  res: 12,            // H3 解析度（每格邊長約 10 公尺）
  walkR: 30,          // 步行揭露半徑（公尺）
  vehR: 14,           // 車／火車揭露半徑（公尺，沿路一條窄帶）
  walkAcc: 25,        // 步行最差可接受精度（公尺）
  vehAcc: 60,         // 車速時最差可接受精度
  maxAcc: 200,        // 超過這個精度一律丟掉
  walkMaxKmh: 25,     // 低於此速度＝步行／騎車
  groundMaxKmh: 330,  // 地面交通上限（高鐵約 300）
  flightMinKm: 50,    // 飛行至少要跳這麼遠，避免 GPS 跳點被當成飛機
  interpWalkSec: 180, // 兩點間隔在此秒數內才補線（步行）
  interpVehSec: 600,  // 兩點間隔在此秒數內才補線（車）
  interpMaxKm: 40,    // 補線最長距離
  revisitMin: 30,     // 離開超過幾分鐘再回來，才算「又來一次」
  maxPoints: 60000
};

function createEngine(h3) {
  const EDGE = h3.getHexagonEdgeLengthAvg(CFG.res, 'm');
  let s, last, dirty;
  function blank() {
    s = { cells: {}, flights: [], gaps: [], points: [], area: 0, km: { walk: 0, vehicle: 0, flight: 0 } };
    last = null; dirty = true;
  }
  blank();

  function touch(c, t) {
    const e = s.cells[c];
    if (!e) { s.cells[c] = [1, t]; s.area += h3.cellArea(c, 'km2'); dirty = true; }
    else {
      if (t - e[1] > CFG.revisitMin * 60000) { e[0]++; dirty = true; }
      e[1] = t;
    }
  }
  function reveal(lat, lng, r, t) {
    const c0 = h3.latLngToCell(lat, lng, CFG.res);
    const k = Math.ceil(r / (EDGE * 1.5)) + 1;
    for (const c of h3.gridDisk(c0, k)) {
      if (h3.greatCircleDistance([lat, lng], h3.cellToLatLng(c), 'm') <= r + EDGE * 0.5) touch(c, t);
    }
  }
  function revealLine(a, b, r, t) {
    const d = h3.greatCircleDistance([a.lat, a.lng], [b.lat, b.lng], 'm');
    const n = Math.max(1, Math.ceil(d / Math.max(r * 0.6, 5)));
    for (let i = 1; i <= n; i++) {
      const f = i / n;
      reveal(a.lat + (b.lat - a.lat) * f, a.lng + (b.lng - a.lng) * f, r, t);
    }
  }

  // f = {lat, lng, acc(公尺), t(毫秒), spd(公尺/秒 或 null)}
  function process(f) {
    if (!(f.acc <= CFG.maxAcc)) return { ok: false, why: '定位精度太差（' + Math.round(f.acc) + 'm）' };
    if (last && f.t <= last.t) last = null;
    let mode = 'walk', km = 0, dt = 0, kmh = 0, gk = 0;
    if (last) {
      km = h3.greatCircleDistance([last.lat, last.lng], [f.lat, f.lng], 'km');
      dt = (f.t - last.t) / 1000;
      kmh = km / (dt / 3600);
      gk = (f.spd != null && f.spd >= 0 && dt < 30) ? f.spd * 3.6 : kmh;
      if (km >= CFG.flightMinKm && kmh > CFG.groundMaxKmh) mode = 'flight';
      else if (kmh > CFG.groundMaxKmh) return { ok: false, why: 'GPS 跳點，已略過' };
      else if (gk > CFG.walkMaxKmh) mode = 'vehicle';
    }
    if (mode === 'flight') {
      s.flights.push([last.lng, last.lat, f.lng, f.lat, last.t, f.t]);
      s.km.flight += km; dirty = true;
      if (f.acc <= CFG.walkAcc) reveal(f.lat, f.lng, CFG.walkR, f.t);
    } else {
      const maxAcc = mode === 'walk' ? CFG.walkAcc : CFG.vehAcc;
      if (f.acc > maxAcc) return { ok: false, mode, kmh: gk, why: '精度 ' + Math.round(f.acc) + 'm，等更準的定位' };
      const r = mode === 'walk' ? CFG.walkR : CFG.vehR;
      const lim = mode === 'walk' ? CFG.interpWalkSec : CFG.interpVehSec;
      if (last && dt <= lim && km <= CFG.interpMaxKm) {
        revealLine(last, f, r, f.t);
        s.km[mode] += km;
      } else {
        reveal(f.lat, f.lng, r, f.t);
        if (last && km > 1) { s.gaps.push([last.lng, last.lat, f.lng, f.lat]); dirty = true; }
      }
    }
    last = f;
    s.points.push([Math.round(f.t / 1000), +f.lat.toFixed(6), +f.lng.toFixed(6), Math.round(f.acc), mode[0]]);
    if (s.points.length > CFG.maxPoints) s.points.splice(0, s.points.length - CFG.maxPoints);
    return { ok: true, mode, kmh: gk, km };
  }

  return {
    process,
    state: () => s,
    takeDirty() { const d = dirty; dirty = false; return d; },
    resetLast() { last = null; },
    clear: blank,
    dump: () => ({ v: 1, cells: s.cells, flights: s.flights, gaps: s.gaps, points: s.points, km: s.km }),
    load(d) {
      blank();
      if (!d || typeof d !== 'object') return;
      s.cells = d.cells || {}; s.flights = d.flights || []; s.gaps = d.gaps || [];
      s.points = d.points || []; s.km = Object.assign({ walk: 0, vehicle: 0, flight: 0 }, d.km || {});
      s.area = 0;
      for (const c in s.cells) { try { s.area += h3.cellArea(c, 'km2'); } catch (e) { delete s.cells[c]; } }
      dirty = true;
    }
  };
}
/*ENGINE_END*/

// ===== 以下是畫面與地圖 =====
if (typeof h3 === 'undefined' || typeof maplibregl === 'undefined') {
  document.getElementById('status').textContent = '程式庫載入失敗，請重新整理頁面';
  throw new Error('libs missing');
}
// 測試用：背景分頁（自動化截圖）不會跑 requestAnimationFrame，網址加 ?testrender=1 改用計時器驅動 MapLibre
if (/[?&]testrender=1/.test(location.search)) {
  window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 16);
  window.cancelAnimationFrame = id => clearTimeout(id);
}
const STORE = 'yangcong.v1';
const engine = createEngine(h3);
const $ = id => document.getElementById(id);

// --- 平台：在 iOS app（Capacitor）裡走原生 plugin；在瀏覽器裡維持原本的網頁作法 ---
const CapX = typeof capacitorExports !== 'undefined' ? capacitorExports : null;
const NATIVE = !!(CapX && CapX.Capacitor && CapX.Capacitor.isNativePlatform());
const BG = NATIVE ? CapX.registerPlugin('BackgroundGeolocation') : null; // 背景定位（CoreLocation）
const FS = NATIVE ? CapX.registerPlugin('Filesystem') : null;            // 檔案（Documents 會跟著 iCloud 手機備份）
const SHARE = NATIVE ? CapX.registerPlugin('Share') : null;              // iOS 分享面板（匯出備份用）
const DATA_FILE = 'onion-map.json';
const REC_FLAG = 'yangcong.recording';
let recording = false;

function toast(msg, ms = 2400) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}

// --- 儲存 ---
// 網頁版存 localStorage；iOS app 存到 app 的 Documents 資料夾（會跟著 iCloud 手機備份走）。
// 背景記錄時每 10 秒最多寫一次，切到背景或停止記錄時立刻寫。
let saveTimer = null, saving = false, saveAgain = false;
async function persistNow() {
  if (saving) { saveAgain = true; return; }
  saving = true;
  const json = JSON.stringify(engine.dump());
  try {
    if (NATIVE) await FS.writeFile({ path: DATA_FILE, data: json, directory: 'DOCUMENTS', encoding: 'utf8' });
    else localStorage.setItem(STORE, json);
  } catch (e) { toast(NATIVE ? '寫入檔案失敗：' + (e.message || e) : '手機上的儲存空間滿了，請到「資料」下載備份'); }
  saving = false;
  if (saveAgain) { saveAgain = false; saveSoon(); }
}
function saveSoon(ms) {
  if (saveTimer) return;
  saveTimer = setTimeout(() => { saveTimer = null; persistNow(); }, ms != null ? ms : (NATIVE && recording ? 10000 : 1500));
}
function flushSave() { clearTimeout(saveTimer); saveTimer = null; persistNow(); }
async function loadSaved() {
  let raw = null;
  if (NATIVE) { try { raw = (await FS.readFile({ path: DATA_FILE, directory: 'DOCUMENTS', encoding: 'utf8' })).data; } catch (e) {} }
  if (!raw) { try { raw = localStorage.getItem(STORE) || localStorage.getItem('digua.v1'); } catch (e) {} }
  if (!raw) return false;
  try { engine.load(JSON.parse(raw)); } catch (e) { return false; }
  return true;
}

// --- 地圖樣式：手札風（米白紙、鋼筆墨線、淡水彩；只有探索過的地方看得到） ---
const INK = '#2E2820', INK_SOFT = '#5C5244', PAPER = '#F3ECDB';
const FONT = ['Luoyan']; // 英數與標點從 fonts/glyphs/ 取；中文字由 MapLibre 用本機手寫字型畫（localIdeographFontFamily）
const NAME = ['coalesce', ['get', 'name:zh-Hant'], ['get', 'name:zh'], ['get', 'name']];
// 道路＝外層墨線＋內層紙色，看起來像鋼筆畫的雙線；縮小時內層歸零，變回單線。
// 寬度順序：[幹道, 主要, 次要／三級, 小巷, 服務道路]，寬度 0 就是不畫（小巷 z12 以下、服務道路 z13 以下不畫）
const RC = ['motorway', 'trunk'], RP = ['primary'], RS = ['secondary', 'tertiary'], RM = ['minor'];
const roadW = stops => {
  const e = ['interpolate', ['exponential', 1.4], ['zoom']];
  for (const [z, [a, b, c, d, s]] of stops) e.push(z, ['match', ['get', 'class'], RC, a, RP, b, RS, c, RM, d, s]);
  return e;
};
const ROAD_IN = roadW([[10, [0, 0, 0, 0, 0]], [11, [1.0, 0.7, 0, 0, 0]], [12, [1.4, 1.0, 0.5, 0, 0]], [13, [1.8, 1.4, 0.8, 0, 0]],
  [14, [2.6, 2.0, 1.1, 0, 0]], [16, [7, 5.5, 4, 1.8, 1]], [18, [16, 13, 10, 6, 4.5]]]);
const ROAD_OUT = roadW([[8, [1.4, 1, 0.6, 0, 0]], [10, [1.8, 1.3, 0.8, 0, 0]], [11, [2.4, 1.8, 1.0, 0, 0]], [12, [2.8, 2.2, 1.4, 0.35, 0]],
  [13, [3.2, 2.6, 1.8, 0.55, 0.3]], [14, [4.6, 4.0, 3.1, 0.9, 0.6]], [16, [9.4, 7.9, 6.4, 4.2, 3]], [18, [19.2, 16.2, 13.2, 9.2, 7]]]);
const ROADS = ['match', ['get', 'class'], ['motorway', 'trunk', 'primary', 'secondary', 'tertiary', 'minor', 'service'], true, false];
const LABEL = { 'text-color': INK, 'text-halo-color': PAPER, 'text-halo-width': 1.6, 'text-halo-blur': 0.4 };

function paperImage() {
  const n = 160, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d'); g.fillStyle = PAPER; g.fillRect(0, 0, n, n);
  for (let i = 0; i < 2200; i++) {
    const v = Math.random();
    g.fillStyle = v < 0.5 ? 'rgba(120,95,60,' + (Math.random() * 0.06) + ')' : 'rgba(255,252,242,' + (Math.random() * 0.14) + ')';
    g.fillRect(Math.random() * n, Math.random() * n, 1 + Math.random() * 2.2, 1 + Math.random() * 2.2);
  }
  for (let i = 0; i < 6; i++) {
    g.strokeStyle = 'rgba(120,95,60,0.028)'; g.lineWidth = 1; g.beginPath();
    const y = Math.random() * n; g.moveTo(0, y); g.bezierCurveTo(n / 3, y + 8 - Math.random() * 16, n * 2 / 3, y + 8 - Math.random() * 16, n, y); g.stroke();
  }
  const d = g.getImageData(0, 0, n, n);
  return { width: n, height: n, data: new Uint8Array(d.data.buffer) };
}

const TILES = {}; // id -> canvas（圖例拿來當底圖）
function tile(id, w, h, draw, opts) {
  const pr = 2, c = document.createElement('canvas'); c.width = w * pr; c.height = h * pr;
  const g = c.getContext('2d'); g.scale(pr, pr); draw(g, w, h);

}
function pencil(g, x1, y1, x2, y2, color, w, a) { // 鉛筆線：疊三道微抖、深淺不一的線
  for (let k = 0; k < 3; k++) {
    g.strokeStyle = color; g.globalAlpha = a * (0.45 + Math.random() * 0.55); g.lineWidth = w * (0.6 + Math.random() * 0.7); g.lineCap = 'round';
    g.beginPath(); g.moveTo(x1 + (Math.random() - 0.5) * 0.9, y1 + (Math.random() - 0.5) * 0.9); g.lineTo(x2 + (Math.random() - 0.5) * 0.9, y2 + (Math.random() - 0.5) * 0.9); g.stroke();
  }
  g.globalAlpha = 1;
}
function hatchTile(id, n, gap, color, w, a) { // 斜排線，可無縫平鋪
  return tile(id, n, n, g => { for (let x = -n; x <= 2 * n; x += gap) pencil(g, x, n, x + n, 0, color, w, a); });
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();

  g.beginPath(); g.moveTo(cx - s * 0.65, cy - s * 0.1); g.lineTo(cx, cy - s * 0.85); g.lineTo(cx + s * 0.65, cy - s * 0.1); g.stroke();

function treeAt(g, x, y, r, kind) {

    g.fillStyle = '#7FAE57'; g.globalAlpha = 0.85; g.beginPath(); g.moveTo(x, y - r * 1.6); g.lineTo(x + r, y + r * 0.5); g.lineTo(x - r, y + r * 0.5); g.closePath(); g.fill(); g.globalAlpha = 1;

// --- 把探索格子畫成「迷霧上的洞」 ---
function ringArea(r) { let a = 0; for (let i = 0, j = r.length - 1; i < r.length; j = i++) a += (r[j][0] - r[i][0]) * (r[j][1] + r[i][1]); return a; }
function orient(r, positive) { return (ringArea(r) > 0) === positive ? r : r.slice().reverse(); }
function arc(a, b, n = 64) {
  const D = Math.PI / 180, V = (lng, lat) => [Math.cos(lat * D) * Math.cos(lng * D), Math.cos(lat * D) * Math.sin(lng * D), Math.sin(lat * D)];
  const v1 = V(a[0], a[1]), v2 = V(b[0], b[1]);
  const w = Math.acos(Math.min(1, Math.max(-1, v1[0] * v2[0] + v1[1] * v2[1] + v1[2] * v2[2])));
  if (w < 1e-6) return [a, b];
  const out = []; let prev = null;
  for (let i = 0; i <= n; i++) {
    const f = i / n, s1 = Math.sin((1 - f) * w) / Math.sin(w), s2 = Math.sin(f * w) / Math.sin(w);
    const v = [s1 * v1[0] + s2 * v2[0], s1 * v1[1] + s2 * v2[1], s1 * v1[2] + s2 * v2[2]];
    let lng = Math.atan2(v[1], v[0]) / D; const lat = Math.asin(v[2]) / D;
    if (prev !== null) { while (lng - prev > 180) lng -= 360; while (lng - prev < -180) lng += 360; }
    prev = lng; out.push([lng, lat]);
  }
  return out;
}
// 把軌跡點切成一段段線：遇到飛行、斷訊超過 10 分鐘或跳太遠就斷開
function trackLines(pts) {
  const lines = []; let cur = [], prev = null;
  for (const p of pts) {
    const brk = !prev || p[4] === 'f' || p[0] - prev[0] > 600 ||
      Math.abs(p[1] - prev[1]) + Math.abs(p[2] - prev[2]) > 0.4;
    if (brk) { if (cur.length > 1) lines.push(cur); cur = []; }
    cur.push([p[2], p[1]]); prev = p;
  }
  if (cur.length > 1) lines.push(cur);
  return lines;
}
// 迷霧上的「?」：以整數 zoom 的螢幕格子為單位放點，位置用 hash 決定（平移不會跳），落在已探索格子上的不放
function qhash(a, b, c) {
  let h = Math.imul(a, 374761393) + Math.imul(b, 668265263) + Math.imul(c, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1103515245); return (h ^ (h >>> 16)) >>> 0;
}
function updateQ() {
  if (!map.getSource('fogq')) return;
  const z = Math.max(0, Math.floor(map.getZoom())), size = 512 * Math.pow(2, z), step = 150, b = map.getBounds(), cells = engine.state().cells;
  const proj = (lng, lat) => { const s = Math.sin(lat * Math.PI / 180); return [(lng + 180) / 360 * size, (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * size]; };
  const unproj = (x, y) => { const m = 0.5 - y / size; return [x / size * 360 - 180, 90 - 360 * Math.atan(Math.exp(-m * 2 * Math.PI)) / Math.PI]; };
  const [x0, y0] = proj(b.getWest(), b.getNorth()), [x1, y1] = proj(b.getEast(), b.getSouth());
  const feats = [];
  for (let gx = Math.floor(x0 / step); gx <= Math.floor(x1 / step) && feats.length < 120; gx++) {
    for (let gy = Math.floor(y0 / step); gy <= Math.floor(y1 / step); gy++) {
      const h = qhash(gx, gy, z);
      const [lng, lat] = unproj((gx + 0.15 + 0.7 * ((h & 255) / 255)) * step, (gy + 0.15 + 0.7 * (((h >> 8) & 255) / 255)) * step);
      if (Math.abs(lat) > 84) continue;
      if (revealSet ? revealSet.has(h3.latLngToCell(lat, lng, revealRes)) : cells[h3.latLngToCell(lat, lng, CFG.res)]) continue;
      feats.push({ type: 'Feature', properties: { r: ((h >> 16) & 63) - 32, s: 0.8 + ((h >> 22) & 15) / 40 }, geometry: { type: 'Point', coordinates: [lng, lat] } });
    }
  }
  map.getSource('fogq').setData({ type: 'FeatureCollection', features: feats });
}
const WORLD = [[-180, -85], [180, -85], [180, 85], [-180, 85], [-180, -85]];
// 圖幅模式的揭開範圍：紀錄還是 res 12 的細格子，但霧散開的範圍放大。
// 拉近看：換算成 res 11 再往外擴兩圈（走過的路左右約 100 公尺）；縮小看：res 8 的格子（約 1 公里）走進去整格散開
let revealSet = null, revealRes = CFG.res;
function revealTier() { return map.getZoom() < 11 ? 'coarse' : 'fine'; }
function revealCells(ids) {
  const fine = revealTier() === 'fine', res = fine ? 11 : 8, set = new Set();
  for (const c of ids) {
    const p = h3.cellToParent(c, res);
    if (fine) for (const d of h3.gridDisk(p, 2)) set.add(d); else set.add(p);
  }
  revealSet = set; revealRes = res;
  return [...set];
}
let renderTimer = null;
function renderSoon() { if (!renderTimer) renderTimer = setTimeout(() => { renderTimer = null; render(); }, 350); }
function render(force) {
  updateStats();
  if (!map.getSource('fog')) return;
  if (!engine.takeDirty() && !force) return;
  const s = engine.state(), ids = Object.keys(s.cells);
  const rid = typeof STYLE !== 'undefined' && STYLE === 'sheet' ? revealCells(ids) : ids;
  const polys = rid.length ? h3.cellsToMultiPolygon(rid, true) : [];
  const fog = [{ type: 'Feature', properties: {}, geometry: { type: 'Polygon',
    coordinates: [orient(WORLD, true), ...polys.map(p => orient(p[0], false))] } }];
  polys.forEach(p => { for (let i = 1; i < p.length; i++) fog.push({ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [p[i]] } }); });
  map.getSource('fog').setData({ type: 'FeatureCollection', features: fog });
  updateQ();
  map.getSource('explored').setData({ type: 'Feature', properties: {}, geometry: { type: 'MultiPolygon', coordinates: polys } });
  // 去過越多次顏色越深
  const tiers = [2, 5, 10].map(th => ids.filter(c => s.cells[c][0] >= th)).filter(a => a.length);
  map.getSource('freq').setData({ type: 'FeatureCollection', features: tiers.map(a => ({ type: 'Feature', properties: {},
    geometry: { type: 'MultiPolygon', coordinates: h3.cellsToMultiPolygon(a, true) } })) });
  map.getSource('flights').setData({ type: 'FeatureCollection', features: s.flights.map(f => ({ type: 'Feature', properties: {},
    geometry: { type: 'LineString', coordinates: arc([f[0], f[1]], [f[2], f[3]]) } })) });
  map.getSource('track').setData({ type: 'Feature', properties: {}, geometry: { type: 'MultiLineString', coordinates: trackLines(s.points) } });
  map.getSource('gaps').setData({ type: 'FeatureCollection', features: s.gaps.map(g => ({ type: 'Feature', properties: {},
    geometry: { type: 'LineString', coordinates: [[g[0], g[1]], [g[2], g[3]]] } })) });
}
function updateStats() {
  const s = engine.state();
  const a = s.area < 10 ? s.area.toFixed(3) : s.area.toFixed(1);
  $('stats').innerHTML = '<b>' + a + '</b> km²<br>航線 ' + s.flights.length + ' 段 · 地面 ' + Math.round(s.km.walk + s.km.vehicle) + ' km';
}

// --- 處理一個定位點（真實 GPS 與模擬共用同一條路） ---
const MODE_LABEL = { walk: '步行', vehicle: '車／火車', flight: '飛行' };
let follow = true;
function feed(f, quiet) {
  const r = engine.process(f);
  if (r.ok) {
    showMe(f.lng, f.lat);
    if (follow && r.mode !== 'flight') map.easeTo({ center: [f.lng, f.lat], duration: quiet ? 0 : 600 });
    if (r.mode === 'flight') { map.fitBounds(flightBounds(), { padding: 80, duration: 1200 }); toast('偵測到飛行，畫上一段航線'); }
    setStatus(MODE_LABEL[r.mode] + ' · ' + Math.round(r.kmh || 0) + ' km/h · 精度 ' + Math.round(f.acc) + 'm');
    saveSoon(); renderSoon();
  } else setStatus(r.why);
  return r;
}
function flightBounds() {
  const f = engine.state().flights.slice(-1)[0], b = new maplibregl.LngLatBounds();
  arc([f[0], f[1]], [f[2], f[3]]).forEach(p => b.extend(p)); return b;
}
function setStatus(t) { $('status').textContent = t; }
map.on('dragstart', () => { follow = false; });

// --- 真實 GPS ---
// iOS app：走原生 CoreLocation（背景、螢幕關掉都繼續）；網頁：navigator.geolocation，要保持螢幕開啟。
let watchId = null, bgWatcher = null, wakeLock = null;
async function lockScreen() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { if (recording && !NATIVE) lockScreen(); render(true); }
  else if (recording) flushSave();
});
function setRecUI(on) {
  $('btnRec').textContent = on ? '停止記錄' : '開始記錄'; $('btnRec').classList.toggle('rec', on);
  if (!on) $('btnSettings').hidden = true;
}
function onFix(lat, lng, acc, t, spd) {
  feed({ lat, lng, acc, t: t || Date.now(), spd: (typeof spd === 'number' && !isNaN(spd)) ? spd : null });
}
async function startRec() {
  if (recording) return;
  if (simOn) toggleSim();
  engine.resetLast(); follow = true;
  if (NATIVE) {
    try {
      bgWatcher = await BG.addWatcher({
        backgroundMessage: '洋蔥正在記錄你走過的地方', // iOS 要有這個欄位才會開背景定位（文字本身只有 Android 用到）
        backgroundTitle: '洋蔥',
        requestPermissions: true,
        stale: false,
        distanceFilter: 4
      }, (loc, err) => {
        if (err) {
          if (err.code === 'NOT_AUTHORIZED') { setStatus('沒有定位權限，洋蔥畫不了地圖'); $('btnSettings').hidden = false; }
          else setStatus('暫時拿不到定位，持續嘗試中…');
          return;
        }
        onFix(loc.latitude, loc.longitude, loc.accuracy, loc.time, loc.speed);
      });
    } catch (e) { setStatus('無法啟動定位：' + (e.message || e)); return; }
  } else {
    if (!('geolocation' in navigator)) { toast('這個瀏覽器不支援定位'); return; }
    watchId = navigator.geolocation.watchPosition(p => {
      onFix(p.coords.latitude, p.coords.longitude, p.coords.accuracy, p.timestamp, p.coords.speed);
    }, e => {
      setStatus(e.code === 1 ? '沒有定位權限：請到 設定 › Safari › 位置 允許' : '暫時拿不到定位，持續嘗試中…');
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });

  }
  recording = true;
  try { localStorage.setItem(REC_FLAG, '1'); } catch (e) {}

}
async function stopRec() {
  if (!recording) return;
  recording = false;
  try { localStorage.removeItem(REC_FLAG); } catch (e) {}
  if (NATIVE) { if (bgWatcher) { try { await BG.removeWatcher({ id: bgWatcher }); } catch (e) {} } bgWatcher = null; }
  else {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null; try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
  }
  setRecUI(false); setStatus('已停止記錄'); flushSave();
}
$('btnRec').onclick = () => recording ? stopRec() : startRec();
$('btnSettings').onclick = () => { if (BG) BG.openSettings(); };
if (NATIVE) {
  $('note').textContent = 'iOS 會在記錄一陣子後問你要不要改成「永遠允許」位置，選它，手機收進口袋也會繼續畫。資料只存在這支手機。';
  $('btnExport').textContent = '匯出備份';
  // 上次關掉 app 前還在記錄的話，打開就自動接著記（網頁版不這樣做，避免一開網頁就跳權限視窗）
  let resume = false; try { resume = localStorage.getItem(REC_FLAG) === '1'; } catch (e) {}
  if (resume) restored.then(() => startRec());
}
$('btnLocate').onclick = () => {
  follow = true;
  if (meShown) { map.flyTo({ center: me.getLngLat(), zoom: Math.max(map.getZoom(), 15) }); return; }
  navigator.geolocation && navigator.geolocation.getCurrentPosition(
    p => map.flyTo({ center: [p.coords.longitude, p.coords.latitude], zoom: 15 }),
    () => toast('拿不到定位'), { enableHighAccuracy: true, timeout: 10000 });
};

// --- 模擬模式：在桌上點地圖測試 ---
const SIM = { walk: { kmh: 5, every: 4 }, car: { kmh: 50, every: 3 }, hsr: { kmh: 280, every: 5 }, plane: { kmh: 800 } };
let simOn = false, simMode = 'walk', simPos = null, simClock = 0, simQueue = [], simTimer = null;
function toggleSim() {
  simOn = !simOn;
  $('btnSim').classList.toggle('on', simOn); $('simbar').hidden = !simOn;
  if (simOn) { if (recording) stopRec(); simPos = null; engine.resetLast(); setStatus('模擬模式：點地圖'); }
  else { clearInterval(simTimer); simTimer = null; simQueue = []; engine.resetLast(); setStatus('已離開模擬模式'); }
}
$('btnSim').onclick = toggleSim;
document.querySelectorAll('#simbar .seg button').forEach(b => b.onclick = () => {
  simMode = b.dataset.m;
  document.querySelectorAll('#simbar .seg button').forEach(x => x.classList.toggle('on', x === b));
  if (simMode === 'plane') toast('飛機：請點 50 公里以外的地方');
});
function dist(a, b) { return h3.greatCircleDistance([a.lat, a.lng], [b.lat, b.lng], 'm'); }
map.on('click', e => {
  if (!simOn) return;
  const to = { lat: e.lngLat.lat, lng: e.lngLat.lng };
  follow = true;
  if (!simPos) {
    simClock = Date.now(); simPos = to;
    feed({ ...to, acc: 5, t: simClock, spd: 0 }); return;
  }
  simQueue = []; const cfg = SIM[simMode], d = dist(simPos, to);
  if (simMode === 'plane') {
    if (d < 50000) { toast('距離太近（' + (d / 1000).toFixed(1) + ' km），飛機請點 50 公里以外'); return; }
    simClock += d / (cfg.kmh / 3.6) * 1000;
    simQueue.push({ ...to, acc: 10, t: simClock, spd: cfg.kmh / 3.6 });
  } else {
    const step = cfg.kmh / 3.6 * cfg.every, n = Math.max(1, Math.ceil(d / step)), from = simPos;
    for (let i = 1; i <= n; i++) {
      const f = i / n; simClock += cfg.every * 1000 * (i === n ? (d - step * (n - 1)) / step : 1);
      simQueue.push({ lat: from.lat + (to.lat - from.lat) * f, lng: from.lng + (to.lng - from.lng) * f,
        acc: 6 + Math.random() * 6, t: simClock, spd: cfg.kmh / 3.6 });
    }
  }
  if (!simTimer) simTimer = setInterval(() => {
    const per = Math.max(1, Math.ceil(simQueue.length / 120));
    for (let i = 0; i < per && simQueue.length; i++) { const f = simQueue.shift(); simPos = { lat: f.lat, lng: f.lng }; feed(f, true); }
    if (!simQueue.length) { clearInterval(simTimer); simTimer = null; render(); }
  }, 30);
});

    drawCenter = map.getCenter(); drawZoom = map.getZoom();

    const ex = fogOn ? exploredPath() : null;
    if (STYLE === 'sprite') { drawSprite(w, h, z, ex); return; }
    if (FANTASY) { drawFantasy(w, h, z, ex); return; }
    let seed = 1;
    ctx.save(); if (ex) ctx.clip(ex, 'evenodd');
    // 植被、公園：綠色排線
    for (const f of query('landcover', cls(['wood']))) for (const r of rings(f.geometry)) hatchPoly(simplify(proj(r), SK.tol), '#8FB862', 9, -45, 0.9, seed++);
    for (const f of query('park')) for (const r of rings(f.geometry)) hatchPoly(simplify(proj(r), SK.tol), '#9CC070', 10, 45, 0.9, seed++);
    // 水：藍色排線；河流：藍線
    for (const f of query('water')) for (const r of rings(f.geometry)) hatchPoly(simplify(proj(r), SK.tol), '#5B93C4', 7, -30, 0.9, seed++);
    for (const f of query('waterway', cls(['river']))) for (const l of lines(f.geometry)) { const p = simplify(proj(l), SK.tol); if (p.length > 1) rc.linearPath(p, { stroke: '#4F8DC2', strokeWidth: 2.2, roughness: SK.rough, bowing: SK.bow, seed: seed++ }); }
    // 鐵路
    for (const f of query('transportation', cls(['rail']))) for (const l of lines(f.geometry)) { const p = simplify(proj(l), SK.tol); if (p.length > 1) rc.linearPath(p, { stroke: '#2E2820', strokeWidth: 1.4, roughness: SK.rough, seed: seed++ }); }
    // 道路：次要 → 主要 → 幹道，外墨內色。縮得越小畫得越少
    const big = z >= 14;
    if (z >= 14) for (const f of query('transportation', cls(['tertiary']))) for (const l of lines(f.geometry)) road(simplify(proj(l), SK.tol), 4, 2, '#F8ECB8', seed++);
    if (z >= 12.5) for (const f of query('transportation', cls(['secondary']))) for (const l of lines(f.geometry)) road(simplify(proj(l), SK.tol), big ? 5 : 2.8, big ? 2.6 : 1.3, '#F6E39A', seed++);
    for (const f of query('transportation', cls(['primary']))) for (const l of lines(f.geometry)) road(simplify(proj(l), SK.tol), big ? 7 : 4, big ? 4 : 2.2, '#F2CF5B', seed++);
    for (const f of query('transportation', cls(['motorway', 'trunk']))) for (const l of lines(f.geometry)) road(simplify(proj(l), SK.tol), big ? 8 : 4.6, big ? 4.6 : 2.6, '#CFC9BC', seed++);
    ctx.restore();
    if (ex) {
      // 迷霧：全螢幕灰色排線，把已探索區挖掉；已探索區鋪綠色排線，邊界一條淡墨線
      rc.rectangle(-20, -20, w + 40, h + 40, { fill: '#9A948A', fillStyle: 'hachure', hachureGap: 11, fillWeight: 0.7, stroke: 'none', roughness: 1.2, disableMultiStrokeFill: true, seed: 7 });
      ctx.save(); ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = '#000'; ctx.fill(ex, 'evenodd'); ctx.restore();
      ctx.save(); ctx.clip(ex, 'evenodd');
      rc.rectangle(-20, -20, w + 40, h + 40, { fill: '#7FAA55', fillStyle: 'hachure', hachureGap: 8, hachureAngle: -41, fillWeight: 1, stroke: 'none', roughness: 1.4, disableMultiStrokeFill: true, seed: 11 });
      ctx.restore();
      ctx.save(); ctx.strokeStyle = '#5C5244'; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.7; ctx.stroke(ex); ctx.restore();
    }
  }
  map.on('move', () => {
    needDraw = true; if (!drawCenter) return;
    const el = map.getContainer(), p = map.project(drawCenter), s = Math.pow(2, map.getZoom() - drawZoom);
    cv.style.transformOrigin = (el.clientWidth / 2) + 'px ' + (el.clientHeight / 2) + 'px';
    cv.style.transform = 'translate(' + (p.x - el.clientWidth / 2) + 'px,' + (p.y - el.clientHeight / 2) + 'px) scale(' + s + ')';
  });
  map.on('sourcedata', e => { if ((e.sourceId === 'omt' || e.sourceId === 'fog') && e.isSourceLoaded) needDraw = true; });
  map.on('idle', () => { if (needDraw) { needDraw = false; drawSketch(); } });
  window.drawSketch = drawSketch; window.SK = SK; window.sketchCanvas = cv;
}

// ===== 圖幅模式（?style=sheet）：底圖是電腦上先畫好、切成圖磚的圖幅；app 只蓋霧、畫軌跡、放定位點 =====
// 圖磚由 tools/sheet/cut_tiles.py 產生，bounds 抄 tiles/<sheet>/meta.json
const SHEETS = [
  { id: 'taipei', tiles: 'tiles/taipei/{z}/{x}/{y}.webp', bounds: [121.289062, 24.846565, 121.772461, 25.324167], minzoom: 9, maxzoom: 13 }
];
function mistImage() { // 黑濛濛的霧：幾個整數頻率的波疊起來，四邊自然接得上，鋪成 pattern 不會有縫
  const n = 256, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d'), id = g.createImageData(n, n), d = id.data, waves = [];
  for (let k = 0; k < 9; k++) waves.push({ fx: 1 + (k * 7) % 5, fy: 1 + (k * 3) % 5, ph: k * 1.7, amp: 1 / (1 + k * 0.6) });
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let v = 0;
    for (const w of waves) v += w.amp * Math.sin(2 * Math.PI * (w.fx * x / n + w.fy * y / n) + w.ph + 1.6 * Math.sin(2 * Math.PI * (w.fy * x / n - w.fx * y / n)));
    const t = 0.5 + 0.5 * Math.tanh(v * 0.5), r = (Math.random() - 0.5) * 9, i = (y * n + x) * 4;
    d[i] = 26 + t * 34 + r; d[i + 1] = 30 + t * 36 + r; d[i + 2] = 40 + t * 44 + r; d[i + 3] = 255;
  }
  return { width: n, height: n, data: new Uint8Array(d.buffer) };
}
if (STYLE === 'sheet') {
  for (const id of ['water-name', 'road-name', 'road-shield', 'peak', 'place']) LABEL_LAYERS.splice(LABEL_LAYERS.indexOf(id), 1); // 地名已經寫在圖幅上
  map.setMaxZoom(14.5); // 區域圖幅只畫到 z13，再拉近只是放大；步行圖幅做好前先擋在這
  let tier = null;
  map.on('zoomend', () => { const t = revealTier(); if (tier !== null && t !== tier) render(true); tier = t; }); // 粗細揭開範圍切換時重算霧
  map.on('load', () => { tier = revealTier(); });
  map.on('load', () => {
    for (const l of style.layers) if (l.id !== 'bg' && map.getLayer(l.id)) map.setLayoutProperty(l.id, 'visibility', 'none'); // 向量底圖全藏
    for (const id of ['hint-water', 'hint-border', 'explored-hatch', 'freq', 'explored-ink', 'fog-hatch', 'gaps']) if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none');
    for (const s of SHEETS) {
      map.addSource('sheet-' + s.id, { type: 'raster', tiles: [s.tiles], tileSize: 256, bounds: s.bounds, minzoom: s.minzoom, maxzoom: s.maxzoom });
      map.addLayer({ id: 'sheet-' + s.id, type: 'raster', source: 'sheet-' + s.id, paint: { 'raster-fade-duration': 0 } }, 'freq'); // 放在霧的下面
    }
    map.addImage('mist', mistImage());
    map.setPaintProperty('fog', 'fill-pattern', 'mist'); map.setPaintProperty('fog', 'fill-opacity', 0.97);
    map.setPaintProperty('fog-edge', 'line-color', '#12151C'); map.setPaintProperty('fog-edge', 'line-opacity', 0.8);
    map.setLayoutProperty('fog-edge', 'line-join', 'round'); map.setLayoutProperty('fog-edge', 'line-cap', 'round'); // 尖角接頭加模糊會長刺，圓的才像霧散開
    map.setPaintProperty('fog-edge', 'line-width', ['interpolate', ['linear'], ['zoom'], 10, 5, 14, 12]); map.setPaintProperty('fog-edge', 'line-blur', ['interpolate', ['linear'], ['zoom'], 10, 3, 14, 7]);
    map.setPaintProperty('fog-q', 'text-color', '#B7BDC8'); map.setPaintProperty('fog-q', 'text-opacity', 0.5);
    // 軌跡：尋寶圖的紅色虛線，所有縮放都看得到
    map.setPaintProperty('track', 'line-color', '#A33B2E'); map.setPaintProperty('track', 'line-opacity', 0.9);
    map.setPaintProperty('track', 'line-width', ['interpolate', ['linear'], ['zoom'], 8, 1.6, 13, 2.6]); map.setPaintProperty('track', 'line-dasharray', [2.5, 1.6]);
  });
}
updateStats();
